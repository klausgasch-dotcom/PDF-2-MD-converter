[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "PDFs in Markdown umwandeln, mit automatischer OCR für eingescannte PDFs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24", "pymupdf4llm>=0.0.17", "ocrmypdf>=16"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pdf2md = "pdf2md:main"

[tool.setuptools]
py-modules = ["pdf2md"]
