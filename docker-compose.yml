# Start:  docker compose up -d       ->  http://<host>:8000
# Auf dem Raspberry Pi 5 wird automatisch das arm64-Image verwendet.
services:
  pdf2md:
    image: ghcr.io/klausgasch-dotcom/pdf-2-md-converter:latest
    build: .
    container_name: pdf2md
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Zugangsschutz - für öffentliches Hosting unbedingt setzen (z. B. in einer .env-Datei)
      PDF2MD_USER: ${PDF2MD_USER:-}
      PDF2MD_PASSWORD: ${PDF2MD_PASSWORD:-}
      PDF2MD_MAX_UPLOAD_MB: ${PDF2MD_MAX_UPLOAD_MB:-50}
      PDF2MD_MAX_FILES: ${PDF2MD_MAX_FILES:-100}
      PDF2MD_JOB_TTL_MIN: ${PDF2MD_JOB_TTL_MIN:-60}
      PDF2MD_MAX_PARALLEL: ${PDF2MD_MAX_PARALLEL:-1}
      PDF2MD_DEFAULT_LANG: ${PDF2MD_DEFAULT_LANG:-deu+eng}
    # Pi 5 (4-8 GB RAM): Grenze, damit OCR großer Scans das System nicht blockiert
    mem_limit: 2g
